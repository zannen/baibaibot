---

name: Python

"on":
  pull_request:
    branches:
      - develop
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          sudo apt update
          sudo env DEBIAN_FRONTEND=noninteractive apt install -y --no-install-recommends python3-pip python3-virtualenv

      - name: Lint with flake8
        run: |
          tmpdir="$(mktemp -d)"
          venv="$tmpdir/venv"
          virtualenv "$venv"
          source "$venv/bin/activate"
          grep -i "^flake8" test-requirements.txt | xargs pip install
          flake8 .

      - name: Lint with black
        run: |
          tmpdir="$(mktemp -d)"
          venv="$tmpdir/venv"
          virtualenv "$venv"
          source "$venv/bin/activate"
          grep "^black==" test-requirements.txt | xargs pip install
          black --check .

      - name: Lint with isort
        run: |
          tmpdir="$(mktemp -d)"
          venv="$tmpdir/venv"
          virtualenv "$venv"
          source "$venv/bin/activate"
          grep "^isort==" test-requirements.txt | xargs pip install
          isort --check .

      - name: Type-check with mypy
        run: |
          tmpdir="$(mktemp -d)"
          venv="$tmpdir/venv"
          virtualenv "$venv"
          source "$venv/bin/activate"
          grep -E '^(mypy|types-requests)==' test-requirements.txt | xargs pip install
          mypy --ignore-missing-imports .

      - name: Lint with pylint
        run: |
          tmpdir="$(mktemp -d)"
          venv="$tmpdir/venv"
          virtualenv "$venv"
          source "$venv/bin/activate"
          pip install -r requirements.txt
          pip install -r test-requirements.txt
          ./.pylint.sh

      - name: Tests
        run: |
          tmpdir="$(mktemp -d)"
          venv="$tmpdir/venv"
          virtualenv "$venv"
          source "$venv/bin/activate"
          pip install -r requirements.txt
          grep '^pytest==' test-requirements.txt | xargs pip install
          pip install -e .
          pytest

      - name: Coverage
        run: |
          tmpdir="$(mktemp -d)"
          venv="$tmpdir/venv"
          virtualenv "$venv"
          source "$venv/bin/activate"
          pip install -r requirements.txt
          grep -E '^(coverage|pytest)==' test-requirements.txt | xargs pip install
          pip install -e .
          coverage run -m pytest
          coverage report
